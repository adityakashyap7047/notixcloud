version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: notixcloud-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-notixcloud_root_2024}
      MYSQL_DATABASE: notixcloud
      MYSQL_USER: notixcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:-notixcloud_pass_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  panel:
    build: .
    container_name: notixcloud-panel
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://notixcloud:${DB_PASSWORD:-notixcloud_pass_2024}@db:3306/notixcloud
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-this}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/minecraft/data:/opt/minecraft/data
    depends_on:
      db:
        condition: service_healthy

  # Optional: phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: notixcloud-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-notixcloud_root_2024}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
