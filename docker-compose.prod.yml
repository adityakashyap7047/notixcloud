version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: notixcloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel

  db:
    image: mysql:8.0
    container_name: notixcloud-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: notixcloud
      MYSQL_USER: notixcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed to host — only accessible from other containers

  panel:
    build: .
    container_name: notixcloud-panel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://notixcloud:${DB_PASSWORD}@db:3306/notixcloud
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${DOMAIN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    # No ports exposed — Caddy routes to it internally

  # phpMyAdmin — access at https://your-domain:8080
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: notixcloud-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
